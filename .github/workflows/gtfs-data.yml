name: Publish GTFS data

# The reason this increment exists: the bundled stop data goes stale, and
# Truman must never run `npm run build:gtfs` and push again.
#
# Weekly, this rebuilds Oahu's feed into the SQLite asset the app reads and
# publishes it to a fixed release tag. The app checks the manifest on launch and
# downloads a newer build in the background. `assets/db/gtfs.db` stays in the
# repo as the *floor* — the thing a first launch renders while this downloads,
# and the thing every failure here degrades to. This workflow never commits it.

on:
  schedule:
    # 12:00 UTC Monday — 02:00 in Honolulu, which is nobody's commute.
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if the upstream feed has not changed'
        type: boolean
        default: false

# Ran for real before this merged, twice, from a temporary `push` trigger on a
# throwaway branch — `workflow_dispatch` and `schedule` only ever run a workflow
# that exists on the *default* branch, so from a feature branch either is a 404,
# while `push` runs the workflow as defined on the ref pushed. Run
# `30901281396` built and published `gtfs-v1-20260804T103550Z.db`; run
# `30901405253` then exited at the check, because the upstream zip had not
# changed. That is the publish path and the skip path both observed rather than
# argued. The trigger was removed afterwards.

concurrency:
  group: gtfs-data
  cancel-in-progress: false

# Uploading a release asset is a write to the repository's contents.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite for the build, and type stripping so emit.mjs can import
          # SCHEMA_VERSION straight out of data/gtfs/sql.ts.
          node-version: 22

      # Deliberately no `npm ci`. Nothing on this path touches node_modules —
      # the build script is Node builtins plus this repo's own .mjs files, and
      # the one .ts it reaches into imports nothing but a type. That keeps a
      # data refresh independent of the dependency tree's health, which is not
      # nothing: a react-dom peer conflict took three pushes red once. If this
      # step ever starts failing on a missing module, that is the reason, and
      # the fix is to add `npm ci` back rather than to work around it.

      - name: Has the upstream feed changed?
        id: check
        run: node scripts/build-gtfs/publish.mjs check

      # `check` asks whether the *upstream feed* changed, which is the wrong
      # question when the thing that changed is our own build script. Increment
      # 6's route_stops fix produced different output from a byte-identical
      # input, so the weekly cron would have exited `changed=false` forever and
      # the corrected data would never have reached a device.
      #
      # Hashing the built artifact instead is the more correct answer and a
      # bigger change; this is the smallest honest one. It is safe because
      # `check` downloads and caches the feed either way, so a forced run builds
      # from exactly the bytes it hashed.
      #
      # `inputs.force` is empty on a scheduled run, so this reduces to the old
      # condition whenever nobody has asked for anything.
      - name: Decide whether to publish
        id: decide
        run: echo "publish=${{ steps.check.outputs.changed == 'true' || inputs.force }}" >> "$GITHUB_OUTPUT"

      # Everything below is skipped when the feed is byte-identical to the one
      # behind the currently published manifest. Change detection is by hash
      # rather than by date because expiry and republication are different
      # things: a feed can be replaced long before it expires, and can expire
      # with nothing to replace it.
      - name: Build the SQLite asset
        if: steps.decide.outputs.publish == 'true'
        # Reads the zip publish.mjs just cached, so the build runs over exactly
        # the bytes that were hashed.
        run: npm run build:gtfs

      - name: Floor-check and stage the release
        id: package
        if: steps.decide.outputs.publish == 'true'
        run: node scripts/build-gtfs/publish.mjs package "${{ steps.check.outputs.source_sha256 }}"

      - name: Ensure the release exists
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data \
            --title "Stop data" \
            --notes "Generated stop data for the app to download. Published by .github/workflows/gtfs-data.yml; not a software release."

      # Databases first and manifests second, always. A manifest that exists
      # therefore always describes an asset that exists, which is what makes a
      # half-failed run safe rather than a source of 404s. Separate steps rather
      # than one command because a single `gh release upload a b` gives no
      # ordering guarantee.
      #
      # **Two generations.** `manifest.json` is compiled into every binary built
      # before schema v2, and those binaries ignore a manifest that is not their
      # own schema — so a run that stopped publishing v1 would switch their
      # updates off silently, and there is no App Store to push a fix through.
      # Increment 9 retired the rule that this must go on forever (Truman is the
      # only user, and he installs each `.ipa` himself); dropping the older
      # generation is now a decision someone may take, rather than one this
      # workflow forbids. See `manifestNameFor` in scripts/build-gtfs/publish.mjs.
      - name: Upload the databases
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload data "dist/${{ steps.package.outputs.file }}" --clobber
          gh release upload data "dist/${{ steps.package.outputs.legacy_file }}" --clobber

      - name: Upload the manifests
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Both names come from the packaging step. They used to be literals
        # here, and `manifest-v2.json` would have gone looking for a file the
        # script had stopped producing the day SCHEMA_VERSION became 3.
        run: |
          gh release upload data "dist/${{ steps.package.outputs.legacy_manifest }}" --clobber
          gh release upload data "dist/${{ steps.package.outputs.manifest }}" --clobber
