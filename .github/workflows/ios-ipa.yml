name: Build unsigned iOS IPA

# Produces an unsigned .ipa for sideloading via SideStore/AltStore with a free
# Apple ID. No paid Apple Developer account and no Mac are required — signing
# happens on-device at sideload time, not here.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Expo SDK 57's ExpoModulesJSI requires Swift tools 6.2, which means Xcode 26+.
    # macos-15 ships Xcode 16.4 (Swift 6.1) and fails package resolution.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Resolve workspace and scheme
        id: xc
        working-directory: ios
        run: |
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          # CocoaPods registers a scheme per pod target, so the workspace scheme
          # list is mostly dependencies. Expo prebuild names the app scheme after
          # the workspace itself — derive it that way, then verify it exists.
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -list -json -workspace "$WORKSPACE" | node -e "
            let s = '';
            process.stdin.on('data', d => s += d).on('end', () => {
              const want = process.argv[1];
              const schemes = JSON.parse(s).workspace.schemes;
              if (!schemes.includes(want)) {
                console.error('Scheme ' + want + ' not found. Available: ' + schemes.join(', '));
                process.exit(1);
              }
            });
          " "$SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Resolved workspace=$WORKSPACE scheme=$SCHEME"

      - name: Build unsigned .app
        working-directory: ios
        run: |
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package .ipa
        run: |
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "No .app produced — build failed silently"
            exit 1
          fi
          echo "Packaging $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TheBusOahu.ipa Payload
          ls -lh TheBusOahu.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheBusOahu-ipa
          path: TheBusOahu.ipa
          if-no-files-found: error
          retention-days: 30
